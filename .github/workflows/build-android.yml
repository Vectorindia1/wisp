name: Build Android

# No local Gradle/Android-platform install exists in the dev sandbox this
# project was built in (no emulator or device either) -- this workflow is
# the actual verification that the Kotlin compiles and Gradle can produce
# an APK at all, not just a convenience. See android/README.md.

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # github-hosted ubuntu-latest runners ship a full Android SDK already
      # (cmdline-tools + a range of platforms/build-tools pre-cached under
      # $ANDROID_HOME) -- android-actions/setup-android@v3 was tried first
      # and failed trying to fetch the long-removed legacy 'tools' package
      # (`sdkmanager tools` -> "Warning: Failed to find package 'tools'" ->
      # nonzero exit), so this skips that action entirely and just asks the
      # runner's own sdkmanager for the one platform/build-tools pair this
      # project needs.
      - name: Install Android platform + build-tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wisp-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
