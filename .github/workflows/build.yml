name: Build

# Produces installable artifacts for all 3 platforms. Each OS builds its own
# backend binary via PyInstaller (which does not cross-compile -- a Windows
# .exe backend must be built on windows-latest, not cross-compiled from
# Linux) before packaging the Electron shell around it. See
# docs/architecture-decisions.md and scripts/build-backend.js for why.

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_script: build:win
          - os: macos-latest
            build_script: build:mac
          - os: ubuntu-latest
            build_script: build:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller

      - name: Build and package (${{ matrix.build_script }})
        run: npm run ${{ matrix.build_script }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wisp-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: warn
